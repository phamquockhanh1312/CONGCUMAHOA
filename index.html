<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng mã hóa cổ điển</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ỨNG DỤNG MÃ HÓA CỔ ĐIỂN</h1>
        <p class="subtitle">
            Mã hóa và giải mã bằng các thuật toán mã hóa cổ điển
        </p>

        <!-- Chọn loại mã -->
        <div class="row">

            <div class="box">
                <label>Loại mã hóa</label>

                <select id="algorithm">
                    <option value="caesar">Dịch vòng</option>
                    <option value="substitution">Mã thay thế</option>
                    <option value="vigenere">Mã Vigenere</option>
                    <option value="affine">Mã Affine</option>
                    <option value="hill">Mã Hill</option>
                </select>
            </div>

            <div class="box">
                <label>Hệ mã</label>

                <select id="alphabet">
                    <option value="26">Z26 - Tiếng Anh</option>
                    <option value="29">Z29 - Tiếng Việt</option>
                </select>
            </div>

        </div>

        <!-- Bản rõ -->
        <div class="box">
            <label>BẢN RÕ</label>

            <textarea
                id="plaintext"
                placeholder="Nhập bản rõ cần mã hóa..."
            ></textarea>
        </div>

        <!-- Khóa -->
        <div class="box">
            <label>KHÓA / THAM SỐ</label>

            <input
                type="text"
                id="key"
                placeholder="Nhập khóa..."
            >
        </div>

        <!-- Nút -->
        <div class="buttons">

            <button onclick="encrypt()">
                🔒 MÃ HÓA
            </button>

            <button onclick="decrypt()">
                🔓 GIẢI MÃ
            </button>

        </div>

        <!-- Bản mã -->
        <div class="box">
            <label>BẢN MÃ</label>

            <textarea
                id="ciphertext"
                placeholder="Kết quả sẽ hiển thị ở đây..."
            ></textarea>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
