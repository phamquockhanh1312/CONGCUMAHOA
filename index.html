<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng mã hóa cổ điển</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔐 ỨNG DỤNG MÃ HÓA CỔ ĐIỂN</h1>
        <p class="subtitle">Mã hóa và giải mã bằng các thuật toán cổ điển</p>

        <div class="form-group">
            <label>Chọn thuật toán</label>

            <select id="algorithm">
                <option value="caesar">Dịch vòng</option>
                <option value="substitution">Mã thay thế</option>
                <option value="vigenere">Mã Vigenere</option>
                <option value="affine">Mã Affine</option>
                <option value="hill">Mã Hill</option>
            </select>
        </div>

        <div class="form-group">
            <label>Chọn bảng chữ cái</label>

            <select id="alphabet">
                <option value="26">Z26 - Tiếng Anh</option>
                <option value="29">Z29 - Tiếng Việt</option>
            </select>
        </div>

        <div class="form-group">
            <label>Bản rõ</label>

            <textarea
                id="plaintext"
                placeholder="Nhập bản rõ cần mã hóa..."
                rows="5"></textarea>
        </div>

        <div class="form-group">
            <label>Khóa</label>

            <input
                type="text"
                id="key"
                placeholder="Nhập khóa...">
        </div>

        <div class="buttons">

            <button onclick="encrypt()">
                🔒 MÃ HÓA
            </button>

            <button onclick="decrypt()">
                🔓 GIẢI MÃ
            </button>

        </div>

        <div class="form-group">
            <label>Bản mã</label>

            <textarea
                id="ciphertext"
                placeholder="Kết quả bản mã..."
                rows="5"></textarea>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
